name: RiskOps Experiment Lab
on:
  push:
    paths:
      - "experiment_lab/**"
      - ".github/workflows/experimentation-lab.yml"
      - "data/synthetic_user_reports.csv"
      - "scripts/**"
  pull_request:
    paths:
      - "experiment_lab/**"
      - ".github/workflows/experimentation-lab.yml"
      - "data/synthetic_user_reports.csv"
      - "scripts/**"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r experiment_lab/requirements.txt
      - name: Unit tests
        run: python -m pytest experiment_lab/tests -q
      - name: Real repo synthetic dataset integration
        run: python -m experiment_lab.cli --population 5000 --output /tmp/riskops-demo.json --dashboard /tmp/riskops-demo.html
